version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: increase
    groups:
      # vitest and @vitest/* need the exact same version, so update them together, majors included.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Update .playwright-image in the same PR; npm run visual-regression:server fails until it matches.
      playwright:
        patterns:
          - "playwright"
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # FIXME: typescript-eslint が TypeScript 6.1 以降に対応したら外す
      - dependency-name: "typescript"
        versions:
          - ">=6.1.0"
      # 実行環境が Node 24 のあいだは @types/node も 24 系にとどめる
      - dependency-name: "@types/node"
        versions:
          - ">=25"
